<div class="flex min-h-screen items-center justify-center bg-slate-50 p-6 dark:bg-slate-950">
  <div
    class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900"
  >
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Meeting AI</h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
      Transcreva reuniões e atualize seu CRM automaticamente, sempre com revisão humana antes de
      qualquer envio.
    </p>

    <p-button
      label="Entrar com Google"
      icon="pi pi-google"
      styleClass="w-full mt-8"
      (onClick)="loginWithGoogle()"
    />

    <p class="mt-6 text-xs text-slate-400 dark:text-slate-500">
      O login é feito exclusivamente pela sua conta Google.
    </p>
  </div>
</div>
