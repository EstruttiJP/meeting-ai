<div>
  <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-200" [for]="inputId">{{
    label()
  }}</label>
  <div class="flex flex-wrap gap-2">
    @for (item of items(); track item + '-' + $index) {
      <p-chip [label]="item" [removable]="true" (onRemove)="removeItem($index)" />
    }
    @if (items().length === 0) {
      <p class="text-sm text-slate-400 dark:text-slate-500">Nenhum item.</p>
    }
  </div>
  <input
    [id]="inputId"
    type="text"
    [(ngModel)]="draftItem"
    (keydown.enter)="addItem()"
    [placeholder]="placeholder()"
    class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-900 outline-none focus:border-emerald-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"
  />
</div>
