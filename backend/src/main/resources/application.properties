spring.application.name=meeting-ai-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meetingai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.frontend-url=${FRONTEND_URL:http://localhost:4200}

app.storage.local.base-path=${STORAGE_LOCAL_PATH:${java.io.tmpdir}/meeting-ai-storage}

app.meeting.max-file-size-mb=${MEETING_MAX_FILE_SIZE_MB:200}
app.usage-quota.default-monthly-limit=${USAGE_QUOTA_DEFAULT_MONTHLY_LIMIT:10}

spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB

app.transcription.whisper.base-url=${WHISPER_BASE_URL:http://localhost:9000}

app.encryption.key=${APP_ENCRYPTION_KEY:dev-placeholder-encryption-key}
app.encryption.salt=${APP_ENCRYPTION_SALT:deadbeef}

app.summary.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.summary.openrouter.api-key=${OPENROUTER_API_KEY:}
app.summary.openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.1-8b-instruct:free}

app.summary.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.summary.openai.model=${OPENAI_MODEL:gpt-4o-mini}

app.summary.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.summary.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

app.summary.claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com/v1}
app.summary.claude.model=${CLAUDE_MODEL:claude-3-5-haiku-20241022}

app.crm.pipedrive.token-url=${PIPEDRIVE_TOKEN_URL:https://oauth.pipedrive.com/oauth/token}
app.crm.pipedrive.api-base-url=${PIPEDRIVE_API_BASE_URL:https://api.pipedrive.com}
app.crm.pipedrive.client-id=${PIPEDRIVE_CLIENT_ID:}
app.crm.pipedrive.client-secret=${PIPEDRIVE_CLIENT_SECRET:}
app.crm.pipedrive.redirect-uri=${PIPEDRIVE_REDIRECT_URI:http://localhost:4200/settings}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
